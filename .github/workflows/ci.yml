name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Engine pin
        run: python -c "import hashlib, json, pathlib; raw=pathlib.Path('vendor/fsot_compute.py').read_bytes(); pin=hashlib.sha256(raw).hexdigest(); expect=json.loads(pathlib.Path('AUTHORITY_PIN.json').read_text(encoding='utf-8')); assert pin==expect['pin_sha256'], pin; assert pin.startswith(expect['pin_prefix']); print(pin[:12])"
      - name: Import the live pin
        run: python -c "import sys; sys.path.insert(0, 'apparatus'); from fsot_lattice.engine import require_live_pin; print(require_live_pin()[:12])"
      - name: Byte-compile
        run: python -m compileall -q apparatus
      - name: Build the attend
        run: clang -O2 -std=c11 -ffp-contract=off -fno-fast-math -fno-associative-math -shared -fPIC -o apparatus/fsot_lattice/attend_core.so apparatus/fsot_lattice/attend_core.c
      - name: Verify the promoted package and the C attend
        run: python apparatus/verify_lattice.py
